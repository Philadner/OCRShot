[project]
name = "ocrshot"
version = "0.1.0"
description = "Monitor a selected Windows application window with OCR and save screenshots when a word appears."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "pywin32>=308; sys_platform == 'win32'",
    "PySide6>=6.8",
    "rapidocr-onnxruntime>=1.4",
    "onnxruntime-gpu>=1.26.0",
]

[project.scripts]
ocrshot = "ocrshot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
